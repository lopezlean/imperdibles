<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta para redes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 675px; box-sizing: border-box; padding: 56px 64px; background: #F4F5F7; color: #0E1116; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em">imperdibles<span style="color: {{accent}}">.com.ar</span></span>
<span style="padding: 10px 22px; background: {{accent}}; color: #FFFFFF; border-radius: 999px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.01em">17,5% menos</span>
</div>

<div style="display: flex; align-items: center; gap: 48px">
<div role="img" aria-label="Foto del producto pendiente" style="flex: 0 0 260px; height: 260px; border-radius: 20px; background: #E3E6EB; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #5B6472">Foto del producto</div>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 46px; line-height: 1.1; letter-spacing: -0.02em">Xiaomi Robot Vacuum S40C</h1>
<div style="display: flex; flex-direction: column; gap: 14px; font-variant-numeric: tabular-nums">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
<span style="font-size: 22px; font-weight: 600">Mercado Libre</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em">$329.999</span>
</div>
<div style="height: 18px; width: 82.5%; background: #0E1116; border-radius: 999px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
<span style="font-size: 22px; color: #3A4350">Frávega</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 30px; color: #3A4350">$399.999</span>
</div>
<div style="height: 18px; width: 100%; background: #B4BBC6; border-radius: 999px"></div>
</div>
</div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 20px; color: #3A4350">
<span>Mismo modelo, precio de lista al 10/11/2026</span>
<span style="font-weight: 600; color: #0E1116">Diferencia: $70.000</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#0F766E"]},"$preview":{"width":1200,"height":675}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2410C' };
}
}
</script>
</body>
</html>
